name: CI/CD

on:
  push:
    branches: [main]
    # Faqat hujjat o'zgargan commit prod'ni qayta deploy qilmasin (main'ga to'g'ridan-to'g'ri
    # push'da har commit deploy demak — .md/docs uchun konteyner restart'i keraksiz).
    # Kod bilan birga o'zgarsa workflow baribir ishlaydi.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/shavkatbegmatov/family-finance

jobs:
  # ── CI: Sir sizishini skanlash (push/PR'dagi yangi commitlar bo'yicha) ──
  # DEPLOY'NI GATE QILADI (build-and-push needs) — main'ga to'g'ridan-to'g'ri push'da
  # PR ko'rigi yo'q, shuning uchun tasodifan commit qilingan sir prod'ga chiqmasin.
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── CI: Frontend lint + test + build ──
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: family-finance-front
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: family-finance-front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test          # Vitest toza-mantiq testlari (qizil test merge'ni bloklaydi)
      - run: npm run build

  # ── CI: Backend compile + unit tests ──
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: family-finance-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # `clean test` kompilyatsiya + toza-mantiq birlik testlarini ishga tushiradi.
      # Qizil test merge'ni bloklaydi (Docker image build'i alohida -DskipTests bilan).
      # Integration testlar (*IntegrationTest) surefire'da exclude — pastdagi alohida job.
      - run: chmod +x mvnw && ./mvnw clean test -q

  # ── CI: Integration testlar (Testcontainers — real PostgreSQL, Docker kerak) ──
  # DEPLOY'NI GATE QILADI (build-and-push needs, 2026-08-12'dan): kuzatuv davrida
  # barqaror ishladi, Telegram auth muddati tuzatishida esa rollback-semantika xatosini
  # faqat shu job ushladi — qizil integratsiya testi endi prod'ga chiqmaydi.
  # ubuntu-latest'da Docker mavjud → Testcontainers ishlaydi.
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: family-finance-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: chmod +x mvnw && ./mvnw test -Dtest='*IntegrationTest' -DfailIfNoTests=false -q

  # ── CD: Build Docker images + push to GHCR ──
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci, secret-scan, integration-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build & push backend
        uses: docker/build-push-action@v7
        with:
          context: ./family-finance-api
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:latest
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-api:v1.7.21
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./family-finance-front
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-front:latest
            ${{ env.IMAGE_PREFIX }}-front:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-front:v1.7.21
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            VITE_IMGBB_API_KEY=${{ secrets.VITE_IMGBB_API_KEY }}
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}

  # ── CD: Trigger Coolify deploy ──
  # Coolify 4.3+ (server 2026-08-28 da yangilangan): /api/v1/deploy va boshqa holat
  # o'zgartiruvchi API endpoint'lar faqat POST qabul qiladi — GET 405 Method Not Allowed
  # qaytaradi (2026-09-02 dagi deploy yiqilishi sababi). Shuning uchun POST.
  # Webhook javobidagi deployment_uuid'lar verify job'iga output sifatida uzatiladi.
  # Javob tanasi log'ga chiqarilmaydi: unda resource_uuid (webhook URL'ning bir qismi) bor,
  # repo esa public.
  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      backend_deployment: ${{ steps.trigger.outputs.backend_deployment }}
      frontend_deployment: ${{ steps.trigger.outputs.frontend_deployment }}
    steps:
      - name: Trigger backend + frontend deployments
        id: trigger
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          BACKEND_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          FRONTEND_WEBHOOK_URL: ${{ secrets.COOLIFY_FRONTEND_WEBHOOK_URL }}
        run: |
          trigger() {
            local name="$1" url="$2" body uuid message
            body=$(curl -fsS -X POST "$url" \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              --max-time 30)
            uuid=$(printf '%s' "$body" | jq -r '.deployments[0].deployment_uuid // empty' 2>/dev/null || true)
            message=$(printf '%s' "$body" | jq -r '.deployments[0].message // .message // empty' 2>/dev/null || true)
            # Diqqat: ${var:-...} ichida apostrof ISHLATMA — bash uni qo'shtirnoq deb o'qib,
            # yopuvchi } ni topolmaydi (sintaksis xatosi, exit 2 — 2026-09-03 run #33689143902).
            echo "$name: ${message:-javob JSON emas} (deployment_uuid=${uuid:-topilmadi})"
            echo "${name}_deployment=$uuid" >> "$GITHUB_OUTPUT"
          }
          trigger backend "$BACKEND_WEBHOOK_URL"
          trigger frontend "$FRONTEND_WEBHOOK_URL"

  # ── CD: Deploy'dan keyin prod sog'ligini tekshirish ──
  # Coolify webhook'ni qabul qilishi deploy muvaffaqiyat DEGANI EMAS — konteyner
  # haqiqatda ko'tarilganini bu job tekshiradi. Backend VA frontend ikkalasi ham
  # 200 bo'lishi shart (2026-06-16 frontend 503 jim outage'idan keyin qo'shildi).
  # 2026-09-03: avval Coolify API'dan har bir deployment `finished` bo'lgunicha kutiladi —
  # aks holda eski konteyner hali javob berayotganda 200 kelib, tekshiruv yangi versiyani
  # emas, eskisini tasdiqlab yuborardi. Holatni kuzatib bo'lmasa (token `read` huquqisiz,
  # uuid kelmagan) — ogohlantirish bilan eski 120s kutishga qaytadi.
  verify:
    name: Verify Deploy
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Wait for Coolify deployments to finish
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          BACKEND_DEPLOYMENT: ${{ needs.deploy.outputs.backend_deployment }}
          FRONTEND_DEPLOYMENT: ${{ needs.deploy.outputs.frontend_deployment }}
        run: |
          fallback=0
          for pair in "backend:$BACKEND_DEPLOYMENT" "frontend:$FRONTEND_DEPLOYMENT"; do
            name="${pair%%:*}"; uuid="${pair#*:}"
            echo "== $name =="
            rc=0
            bash .github/scripts/wait-coolify-deployment.sh \
              "$COOLIFY_WEBHOOK_URL" "$COOLIFY_API_TOKEN" "$uuid" || rc=$?
            if [ "$rc" = "2" ]; then
              fallback=1
            elif [ "$rc" != "0" ]; then
              exit "$rc"
            fi
          done
          if [ "$fallback" = "1" ]; then
            echo "Coolify holatini kuzatib bo'lmadi — rollout uchun 120s kutish (vaqtga asoslangan usul)"
            sleep 120
          fi

      - name: Health-check backend + frontend
        run: |
          api=000; front=000
          for i in $(seq 1 24); do
            api=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://api.family-finance.uz/api/actuator/health || echo 000)
            front=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://family-finance.uz || echo 000)
            echo "urinish $i: api=$api front=$front"
            if [ "$api" = "200" ] && [ "$front" = "200" ]; then
              echo "Prod sog'lom: api=200 front=200"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Deploy verify FAILED — api=$api front=$front (prod tiklanmadi)"
          exit 1
