name: Playwright Smoke (deploy'ni bloklamaydi)

# ─────────────────────────────────────────────────────────────────────────────
# G7 — Playwright READ-ONLY smoke: login + a11y, realtime (SockJS/STOMP),
# 3D genealogiya grafi (WebGL). `main`ga har push'da AVTOMATIK ishlaydi,
# qo'lda ham ishga tushirish mumkin (`workflow_dispatch`).
#
# DEPLOY'NI GATE QILMAYDI — `ci.yml` dagi `build-and-push` faqat
# `frontend-ci`/`backend-ci`/`secret-scan` ni kutadi va bu butunlay alohida
# workflow. Ya'ni smoke qizil bo'lsa ham prod deploy to'xtamaydi; xuddi
# `integration-test` jobi kabi — signal beradi, yo'lni to'smaydi.
#
# `continue-on-error` ATAYLAB YO'Q: u bo'lsa testlar yiqilganda ham run
# yashil ko'rinardi va buzuqlik sezilmay qolardi. Endi qizil = qizil, lekin
# zarari faqat shu workflow bilan cheklangan.
#
# PostgreSQL + backend docker-compose bilan ko'tariladi (backend porti
# host:8098 ga override orqali ochiladi), keyin Playwright frontend dev
# serverni (`npm run dev`, :5178) o'zi ko'tarib smoke yuradi. Dev server
# /api ni :8098 ga proxy qiladi.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
    # Hujjat-only commit uchun docker build + brauzer yuklash ortiqcha
    # (ci.yml ham xuddi shu ro'yxatni e'tiborsiz qoldiradi).
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: playwright-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: E2E Smoke (READ-ONLY)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # docker-compose.dev.yml talab qiladigan sirlar — bu FAQAT efemer CI
      # konteyneri uchun dummy qiymatlar (prod sir EMAS, lokal smoke only).
      DB_NAME: family_finance_db
      DB_USERNAME: family_finance_user
      DB_PASSWORD: ci_smoke_pw
      # JwtTokenProvider.init() `Decoders.BASE64.decode()` qiladi — qiymat BASE64
      # bo'lishi SHART (dekodlangach >=32 bayt, HMAC-SHA256 uchun). Oddiy matn
      # bersak "Illegal base64 character: '-'" bilan backend ko'tarilmaydi.
      # Bu quyida: base64("ci-smoke-only-not-a-real-secret-0123456789abcdef").
      JWT_SECRET: Y2ktc21va2Utb25seS1ub3QtYS1yZWFsLXNlY3JldC0wMTIzNDU2Nzg5YWJjZGVm # gitleaks:allow
      # CardEncryptionService kalitni oddiy UTF-8 satr sifatida oladi (32 baytga
      # padding/trim) — bunisi base64 BO'LMASLIGI kerak.
      CARD_ENCRYPTION_KEY: ci-smoke-card-key-0123456789abcdef0123456789abcdef

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: family-finance-front/package-lock.json

      # ── Backend portini hostga ochish uchun compose override ──
      # Asosiy docker-compose.dev.yml backend'da `ports` yo'q (faqat ichki).
      # Dev frontend proxy (:8098) uchun host portini ochamiz.
      - name: Compose override yozish (backend portini ochish)
        run: |
          cat > docker-compose.ci.yml <<'YAML'
          services:
            backend:
              ports:
                - "8098:8098"
          YAML

      # ── DB + backend'ni ko'tarish (frontend'siz — uni Playwright o'zi ko'taradi) ──
      - name: Backend + DB ni ko'tarish (docker compose)
        run: |
          docker compose -f docker-compose.dev.yml -f docker-compose.ci.yml \
            up -d --build db backend

      # Backend ko'tarilmasa DARHOL to'xtaymiz: aks holda har bir test
      # ECONNREFUSED bilan 30s timeout'ga uchraydi va asl sabab (masalan
      # noto'g'ri JWT_SECRET) test xatolari ostida ko'rinmay qoladi.
      - name: Backend sog'lig'ini kutish (:8098)
        run: |
          echo "Backend ko'tarilishini kutish..."
          for i in $(seq 1 48); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://localhost:8098/api/actuator/health || echo 000)
            echo "urinish $i: backend=$code"
            [ "$code" = "200" ] && echo "Backend tayyor." && exit 0
            sleep 5
          done
          echo "::error::Backend 4 daqiqada 200 qaytarmadi — quyidagi 'Konteyner loglari' qadamida sababni ko'ring."
          exit 1

      # ── Smoke uchun oddiy oila hisobi ──
      # Seed'dagi `admin` — SUPER_ADMIN, u oila daraxtiga kira olmaydi
      # (AdminLayout'da moliya/oila menyulari ataylab yo'q), shuning uchun 3D
      # genealogiya grafi qismini u bilan sinab bo'lmaydi. Register endpointi
      # ochiq va yangi foydalanuvchiga family_group + HOUSEHOLD scope +
      # family_member ni o'zi provisioning qiladi — aynan kerakli holat.
      #
      # Bu ATAYLAB Flyway migratsiyasi emas: demo hisob prod DB'ga tushmasligi
      # kerak, u faqat shu efemer CI konteynerida yashaydi.
      - name: CI demo oila hisobini yaratish (3D graf smoke uchun)
        run: |
          code=$(curl -sS -o /tmp/reg.json -w '%{http_code}' \
            -X POST http://localhost:8098/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{
              "firstName": "Demo",
              "lastName": "Oila",
              "username": "ci_demo_family",
              "password": "CiSmokeDemo2026",
              "confirmPassword": "CiSmokeDemo2026",
              "gender": "MALE"
            }' || echo 000)
          echo "register javobi: HTTP $code"
          head -c 300 /tmp/reg.json || true
          echo
          if [ "$code" != "200" ]; then
            echo "::warning::Demo oila hisobi yaratilmadi — smoke 3D bo'limini o'tkazib yuboradi."
          fi
        continue-on-error: true

      # ── Frontend deps + Playwright brauzeri ──
      - name: Frontend deps (npm ci)
        working-directory: family-finance-front
        run: npm ci

      - name: Playwright chromium o'rnatish
        working-directory: family-finance-front
        run: npx playwright install --with-deps chromium

      # ── Smoke ── (Playwright `npm run dev` ni webServer sifatida o'zi ko'taradi)
      - name: Playwright smoke (READ-ONLY)
        working-directory: family-finance-front
        env:
          CI: 'true'
        run: npm run e2e

      - name: Playwright hisobotini yuklash (artefakt)
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: family-finance-front/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Konteyner loglari (debug, har holatda)
        if: ${{ always() }}
        run: |
          echo "===== compose ps ====="
          docker compose -f docker-compose.dev.yml -f docker-compose.ci.yml ps || true
          echo "===== backend logs ====="
          docker compose -f docker-compose.dev.yml -f docker-compose.ci.yml logs backend 2>&1 | tail -120 || true
        continue-on-error: true
