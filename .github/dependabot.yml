version: 2
updates:
  # Backend — Maven
  - package-ecosystem: "maven"
    directory: "/family-finance-api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]
    commit-message:
      prefix: "deps(api)"
    # Minor/patch bump'lar bitta PR bo'lib keladi — 2026-09-03'da 9 ta alohida PR yig'ilib
    # qolgan edi, har biri alohida CI + deploy tsikli. Major'lar ataylab alohida qoladi.
    groups:
      backend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Frontend — npm
  - package-ecosystem: "npm"
    directory: "/family-finance-front"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "deps(front)"
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # TS 6 major: typescript-eslint peer talabi <6.0.0 — ekotizim qo'llagach olib tashlansin
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Framework-darajali major migratsiyalar — ataylab, alohida loyiha sifatida qilinadi:
      # Tailwind 4 (config formati + daisyUI mosligi + vizual regressiya)
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # daisyUI 5 — Tailwind 4'ni talab qiladi, birga migratsiya qilinadi
      - dependency-name: "daisyui"
        update-types: ["version-update:semver-major"]
      # React 19 (react+react-dom+types birga, ref/JSX o'zgarishlari)
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      # @types/node runtime'ga mos bo'lishi kerak (CI Node 24) — major'ni qo'lda boshqaramiz
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Vite major: @vitejs/plugin-react-swc peer'i hali qo'llamaydi (#253 npm ci ERESOLVE) —
      # plugin vite 8'ni qo'llagach ikkalasi birga ataylab bump qilinadi
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "deps(ci)"
    groups:
      ci-actions:
        patterns: ["*"]
